apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "invite-me.fullname" . }}
  labels:
    {{- include "invite-me.labels" . | nindent 4 }}
spec:
{{/*  {{- if not .Values.autoscaling.enabled }}*/}}
{{/*  replicas: {{ .Values.replicaCount }}*/}}
{{/*  {{- end }}*/}}
  selector:
    matchLabels:
      {{- include "invite-me.selectorLabels" . | nindent 6 }}
  template:
    metadata:
{{/*      {{- with .Values.podAnnotations }}*/}}
{{/*      annotations:*/}}
{{/*        {{- toYaml . | nindent 8 }}*/}}
{{/*      {{- end }}*/}}
      labels:
        {{- include "invite-me.labels" . | nindent 8 }}
{{/*	{{- with .Values.podLabels }}*/}}
{{/*        {{- toYaml . | nindent 8 }}*/}}
{{/*        {{- end }}*/}}
    spec:
{{/*      {{- with .Values.imagePullSecrets }}*/}}
{{/*      imagePullSecrets:*/}}
{{/*        {{- toYaml . | nindent 8 }}*/}}
{{/*      {{- end }}*/}}
      serviceAccountName: {{ include "invite-me.serviceAccountName" . }}
{{/*      securityContext:*/}}
{{/*        {{- toYaml .Values.podSecurityContext | nindent 8 }}*/}}
      containers:
        - name: {{ .Chart.Name }}
{{/*          securityContext:*/}}
{{/*            {{- toYaml .Values.securityContext | nindent 12 }}*/}}
          image: "{{ .Values.inviteme.image.repository }}:{{ .Values.inviteme.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.inviteme.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
{{/*          livenessProbe:*/}}
{{/*            httpGet:*/}}
{{/*              path: /*/}}
{{/*              port: http*/}}
{{/*          readinessProbe:*/}}
{{/*            httpGet:*/}}
{{/*              path: /*/}}
{{/*              port: http*/}}
          env:
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: {{ .Values.inviteme.otelCollector.logs.endpoint }}
            - name: POSTGRES_CONNECTION_STRING
              value: {{ .Values.inviteme.postgres.connection }}
          resources:
            {{- toYaml .Values.inviteme.resources | nindent 12 }}
{{/*          {{- with .Values.volumeMounts }}*/}}
{{/*          volumeMounts:*/}}
{{/*            {{- toYaml . | nindent 12 }}*/}}
{{/*          {{- end }}*/}}
{{/*      {{- with .Values.volumes }}*/}}
{{/*      volumes:*/}}
{{/*        {{- toYaml . | nindent 8 }}*/}}
{{/*      {{- end }}*/}}
{{/*      {{- with .Values.nodeSelector }}*/}}
{{/*      nodeSelector:*/}}
{{/*        {{- toYaml . | nindent 8 }}*/}}
{{/*      {{- end }}*/}}
{{/*      {{- with .Values.affinity }}*/}}
{{/*      affinity:*/}}
{{/*        {{- toYaml . | nindent 8 }}*/}}
{{/*      {{- end }}*/}}
{{/*      {{- with .Values.tolerations }}*/}}
{{/*      tolerations:*/}}
{{/*        {{- toYaml . | nindent 8 }}*/}}
{{/*      {{- end }}*/}}
