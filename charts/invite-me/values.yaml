# Default values for invite-me.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# many defaults are commented out because they are unused, but may be useful in the future

# replicaCount: 1

image:
  repository: ghcr.io/whale-net/invite-me
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

#imagePullSecrets: []
#nameOverride: ""
#fullnameOverride: ""

resources:
  # despite recommendations against this, we are going to provide factory defaults because we are the only users
  limits:
    cpu: 50m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 128Mi

service:
  type: ClusterIP
  port: 80


serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# intended for dev use only - does not run as sidecar
otelCollector:
  enabled: False

